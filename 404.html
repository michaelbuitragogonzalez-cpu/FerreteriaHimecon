<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Con <base> las imágenes y estilos cargan bien aunque la dirección rota sea larga -->
    <base href="/FerreteriaHimecon/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Página no encontrada | Himecon</title>
    <meta name="theme-color" content="#39A9FF">
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/extras.css">
    <link rel="stylesheet" href="css/movil.css">
    <link rel="stylesheet" href="css/pulido.css">
    <style>
        .pantalla .error-codigo { font-size: clamp(64px, 18vw, 120px); font-weight: 800; line-height: 1; color: #39A9FF; margin: 6px 0 0; }
        .pantalla .acciones-404 { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin-top: 8px; }
    </style>
</head>

<body class="inicio">

<div class="pantalla">
    <img src="img/logo.png" class="logo-grande" alt="Logo Himecon">

    <p class="error-codigo">404</p>
    <h1>Esta página no existe</h1>

    <p>Puede que el enlace esté mal escrito o que la página ya no esté. Mejor busquemos lo que necesitas en el catálogo.</p>

    <div class="acciones-404">
        <a href="productos.html" class="boton">Ir al catálogo</a>
        <a href="catalogo.html" class="boton boton-secundario">Volver al inicio</a>
    </div>
</div>

<!-- Botón flotante de WhatsApp -->
<a href="https://wa.me/573206150674" class="whatsapp-flotante" target="_blank" aria-label="Escríbenos por WhatsApp">
    <img src="img/whatsapp.png" alt="WhatsApp" onerror="this.style.display='none'; this.parentElement.innerHTML='💬';">
</a>

<script>
    // Respeta el modo oscuro elegido en las otras páginas
    try {
        if (localStorage.getItem("himecon-modo-oscuro") === "1") {
            document.body.classList.add("modo-oscuro");
        }
    } catch (e) {}
</script>

</body>
</html>
